AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFrugal - Provisions both the IAM Role and S3 Read-Only Policy for storage frugality audits.'

Parameters:
  CloudFrugalAccountId:
    Type: String
    AllowedPattern: '^[0-9]{12}$'
    ConstraintDescription: 'Must be a valid 12-digit AWS Account ID.'
    Description: 'The CloudFrugal AWS Account ID authorized to assume this role.'

  ExternalId:
    Type: String
    MinLength: 8
    Description: 'Unique External ID provided by CloudFrugal to prevent the Confused Deputy problem.'

  RoleName:
    Type: String
    Default: 'CloudFrugalS3ReadOnlyRole'
    Description: 'Name of the IAM Role created for CloudFrugal.'

Resources:
  # 1. First-class IAM Managed Policy for S3 Read-Only Metadata Inspection
  CloudFrugalS3ReadOnlyPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
      ManagedPolicyName: !Sub '\${RoleName}-Policy'
      Description: 'Least-privilege policy allowing CloudFrugal to inspect S3 bucket configurations, lifecycle rules, and tiering metrics'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: 'S3MetadataAndMetricsRead'
            Effect: Allow
            Action:
              - 's3:ListAllMyBuckets'
              - 's3:ListBucket'
              - 's3:GetBucketLocation'
              - 's3:GetLifecycleConfiguration'
              - 's3:GetBucketTagging'
              - 's3:GetBucketVersioning'
              - 's3:GetBucketAcl'
              - 's3:GetBucketPolicy'
              - 's3:GetBucketPolicyStatus'
              - 's3:GetEncryptionConfiguration'
              - 's3:GetBucketPublicAccessBlock'
              - 's3:GetBucketIntelligentTieringConfiguration'
              - 's3:GetAnalyticsConfiguration'
              - 's3:GetMetricsConfiguration'
              - 's3:GetInventoryConfiguration'
            Resource: '*'

  # 2. IAM Role with STS Trust Relationship Policy attached
  CloudFrugalS3ReadOnlyRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Ref RoleName
      Description: 'Allows CloudFrugal to assume role and audit S3 storage frugality'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: 'CloudFrugalAssumeRoleTrustPolicy'
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::\${CloudFrugalAccountId}:root'
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref ExternalId
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess'
        - !Ref CloudFrugalS3ReadOnlyPolicy

Outputs:
  RoleArn:
    Description: 'The ARN of the IAM Role created for CloudFrugal'
    Value: !GetAtt CloudFrugalS3ReadOnlyRole.Arn
    Export:
      Name: !Sub '\${AWS::StackName}-RoleArn'

  PolicyArn:
    Description: 'The ARN of the standalone S3 Read-Only Managed Policy'
    Value: !Ref CloudFrugalS3ReadOnlyPolicy
    Export:
      Name: !Sub '\${AWS::StackName}-PolicyArn'

  ExternalId:
    Description: 'The External ID configured in the Trust Relationship'
    Value: !Ref ExternalId
